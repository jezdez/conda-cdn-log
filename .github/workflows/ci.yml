name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CONDA_REPORT_ERRORS: "false"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.11.2
        id: pixi
        with:
          pixi-version: v0.83.0
          locked: true

      - name: Test
        run: pixi run test

      - name: Lint
        run: pixi run lint

      - name: Check formatting
        run: pixi run format-check

      - name: Check types
        run: pixi run type-check

      - name: Capture a live conda request
        if: ${{ always() && steps.pixi.outcome == 'success' }}
        env:
          CONDA_CDN_LOG_DIR: ${{ runner.temp }}/conda-cdn-log
          CONDA_PKGS_DIRS: ${{ runner.temp }}/conda-cdn-log-pkgs
        run: |
          pixi run python -m conda search --override-channels --channel conda-forge --repodata-fn current_repodata.json --json zlib > "$RUNNER_TEMP/conda-search.json"
          pixi run python - <<'PY'
          import json
          import os
          from pathlib import Path

          events = [
              json.loads(line)
              for path in Path(os.environ["CONDA_CDN_LOG_DIR"]).glob("*.jsonl")
              for line in path.read_text(encoding="utf-8").splitlines()
          ]
          responses = sum(event["event"] == "response" for event in events)
          assert responses, "The conda request produced no HTTP response records"
          print(f"Captured {responses} HTTP responses")
          PY

      - name: Add HTTP diagnostics to the run summary
        if: ${{ always() && steps.pixi.outcome == 'success' }}
        run: pixi run python -m conda cdn-log "$RUNNER_TEMP/conda-cdn-log" --github-summary

      - name: Upload HTTP diagnostic records
        if: ${{ always() && steps.pixi.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: conda-http-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conda-cdn-log/*.jsonl
          if-no-files-found: warn
          retention-days: 14
