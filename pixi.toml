[workspace]
name = "conda-cdn-log"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
conda = ">=26.7.3,<27"
requests = ">=2.28,<3"
urllib3 = ">=2,<3"
pip = "*"
setuptools = ">=68"
pytest = "*"
pytest-mock = "*"
ruff = "*"
ty = "*"

[pypi-dependencies]
conda-cdn-log = { path = ".", editable = true }

[tasks]
test = "python -m pytest"
lint = "ruff check ."
format-check = "ruff format --check ."
type-check = "ty check src"
